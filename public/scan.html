<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Camera Scanner — PicsAlive</title>
  <meta name="description" content="Scan your registered photographs and watch them come alive with full-screen video playback.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0c10;
      font-family: var(--font-sans);
    }

    #reticle {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(72vw, 300px);
      aspect-ratio: 1;
      border: 2px dashed rgba(197, 213, 224, 0.45);
      border-radius: 20px;
      pointer-events: none;
      z-index: 25;
      transition: all 0.3s ease;
    }

    #reticle.active {
      border-color: var(--burgundy);
      border-style: solid;
      box-shadow: 0 0 25px rgba(122, 35, 50, 0.6);
      transform: translate(-50%, -50%) scale(1.04);
    }

    #hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 24px 16px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(to top, rgba(10, 12, 16, 0.9) 0%, rgba(10, 12, 16, 0.4) 60%, transparent 100%);
      pointer-events: none;
    }

    #hint {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Video Player Progress and Timeline */
    .player-progress-bar {
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
      cursor: pointer;
      accent-color: var(--burgundy);
    }
  </style>
</head>
<body class="scan-page">

  <!-- Initial Launcher Screen -->
  <div id="startScreen" class="scan-start">
    <div class="scan-start__logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      Pics<span>Alive</span>
    </div>

    <h1 class="scan-start__title" id="startTitle">Relive Your Memory</h1>
    <p class="scan-start__desc" id="startDesc">
      Point your camera at your printed photograph to unlock the living story.
    </p>

    <!-- Registered Photo Thumbnails -->
    <div id="thumbStrip" class="scan-start__thumbs" style="display: none;"></div>

    <button id="startBtn" class="scan-start__btn">
      📷 Start Camera Scanner
    </button>

    <div style="display: flex; gap: 14px; margin-top: 8px;">
      <a href="/dashboard.html" class="btn btn--ghost btn--sm" style="color: var(--powder-blue);">
        My Memories
      </a>
      <a href="/" class="btn btn--ghost btn--sm" style="color: rgba(255,255,255,0.6);">
        Home
      </a>
    </div>

    <div id="startError" style="display: none; color: #ff8888; font-size: 13px; max-width: 320px; margin-top: 10px;"></div>
  </div>

  <!-- Camera HUD & Controls -->
  <div id="arTopbar" class="ar-topbar" style="display: none;">
    <a href="/dashboard.html" class="ar-topbar__btn">
      ← Back
    </a>
    <span class="ar-badge">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #4ADE80; display: inline-block;"></span>
      PicsAlive Scanner
    </span>
    <button id="switchAudioBtn" class="ar-topbar__btn">
      🔊 Sound On
    </button>
  </div>

  <div id="reticle" style="display: none;"></div>

  <div id="hud" style="display: none;">
    <div id="hint">Point camera at your photo</div>
  </div>

  <!-- Short Loading Animation (Cute Animated Dots, 1-2s) -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-overlay__text">
      Bringing your memory to life
      <span class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </div>
    <div class="loading-overlay__sub" id="loadingMemoryTitle">Recognized photograph</div>
  </div>

  <!-- Dedicated Immersive Full-Screen Video Player -->
  <div id="videoOverlay" class="video-overlay" style="display: none;">
    <!-- Top Bar with Title and Close/Scan Again -->
    <div class="video-overlay__topbar">
      <div class="video-overlay__title" id="playerTitle">Memory Playback</div>
      <button class="video-overlay__close" id="closePlayerBtn" title="Return to Camera">✕</button>
    </div>

    <!-- The Video Element (fills screen responsively) -->
    <video
      id="immersiveVideo"
      class="video-overlay__video"
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <!-- Bottom Controls -->
    <div class="video-overlay__controls">
      <button class="video-overlay__btn" id="playPauseBtn">
        ⏸ Pause
      </button>
      <button class="video-overlay__btn" id="muteToggleBtn">
        🔊 Mute
      </button>
      <button class="video-overlay__btn" id="scanAgainBtn" style="background: var(--burgundy); border-color: var(--burgundy);">
        📷 Scan Another Photo
      </button>
    </div>
  </div>

  <!-- A-Frame & MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.0.0-beta2/dist.es5+umd/msgpack.min.js"></script>

  <!-- Firebase & App SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>

  <script>
    let currentUser = null;
    let targetExperiences = [];
    let activeScene = null;
    let isRecognizing = true;
    let soundEnabled = true;

    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const startTitle = document.getElementById('startTitle');
    const startDesc = document.getElementById('startDesc');
    const thumbStrip = document.getElementById('thumbStrip');
    const startError = document.getElementById('startError');
    const arTopbar = document.getElementById('arTopbar');
    const reticle = document.getElementById('reticle');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('hint');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingMemoryTitle = document.getElementById('loadingMemoryTitle');
    const videoOverlay = document.getElementById('videoOverlay');
    const immersiveVideo = document.getElementById('immersiveVideo');
    const playerTitle = document.getElementById('playerTitle');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const closePlayerBtn = document.getElementById('closePlayerBtn');
    const scanAgainBtn = document.getElementById('scanAgainBtn');
    const switchAudioBtn = document.getElementById('switchAudioBtn');

    // 1. Initialize user & targets
    async function init() {
      try {
        currentUser = await Auth.waitForUser();

        let targetData = null;

        if (currentUser) {
          // Fetch current user's registered photographs
          const userMemories = await DB.getUserMemories(currentUser.uid);
          if (userMemories && userMemories.length > 0) {
            targetExperiences = userMemories;
            targetData = await DB.getUserTargets(currentUser.uid);
          }
        }

        // If user has no targets yet, check backend seed / demo experiences
        if (!targetExperiences || targetExperiences.length === 0) {
          try {
            const res = await fetch('/api/experiences');
            if (res.ok) {
              const data = await res.json();
              if (data && data.length > 0) {
                targetExperiences = data.map(d => ({
                  id: d.id,
                  title: d.title,
                  photoUrl: d.photo_url,
                  videoUrl: d.video_url,
                  targetUrl: d.target_url || '/api/all_targets.mind',
                  ratio: d.ratio || 1.0
                }));
              }
            }
          } catch (_) {}
        }

        renderStartScreen(targetExperiences, targetData);

      } catch (err) {
        console.error('Initialization error:', err);
        startError.textContent = 'Could not load registered memories: ' + err.message;
        startError.style.display = 'block';
      }
    }

    function renderStartScreen(experiences, targetData) {
      if (!experiences || experiences.length === 0) {
        startTitle.textContent = 'No Memories Registered';
        startDesc.innerHTML = 'You have not registered any photographs yet.<br><a href="/create.html" style="color:var(--powder-blue); font-weight:600; text-decoration:underline; margin-top:8px; display:inline-block;">+ Register your first photograph</a>';
        startBtn.style.display = 'none';
        return;
      }

      startTitle.textContent = `Ready to Scan (${experiences.length} Memories)`;
      startDesc.textContent = 'Point your camera at any of your registered photos to unlock immersive playback.';

      thumbStrip.innerHTML = '';
      experiences.forEach(exp => {
        if (exp.photoUrl) {
          const img = document.createElement('img');
          img.className = 'scan-start__thumb';
          img.src = exp.photoUrl;
          img.alt = exp.title || 'Memory';
          thumbStrip.appendChild(img);
        }
      });
      thumbStrip.style.display = 'flex';
    }

    // 2. Start Camera and A-Frame Scene
    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting camera...';

      try {
        let mindUrl = '/api/all_targets.mind';
        if (currentUser) {
          const uTargets = await DB.getUserTargets(currentUser.uid);
          if (uTargets && uTargets.blobUrl) mindUrl = uTargets.blobUrl;
        }

        buildARScene(mindUrl, targetExperiences);
      } catch (err) {
        console.error('Failed to start camera:', err);
        startError.textContent = 'Camera initialization failed: ' + err.message;
        startError.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = '📷 Start Camera Scanner';
      }
    });

    function buildARScene(mindUrl, experiences) {
      // Create target entities
      let targetsHtml = '';
      experiences.forEach((exp, idx) => {
        targetsHtml += `<a-entity id="targetAnchor-${idx}" mindar-image-target="targetIndex: ${idx}"></a-entity>`;
      });

      const sceneHtml = `
        <a-scene id="mindarScene"
          mindar-image="imageTargetSrc: ${mindUrl};
                        maxTrack: 1;
                        filterMinCF: 0.0001;
                        filterBeta: 0.001;
                        missTolerance: 10;
                        warmupTolerance: 5;
                        autoStart: true;
                        uiLoading: no;
                        uiScanning: no;
                        uiError: no;"
          color-space="sRGB"
          renderer="colorManagement: true, physicallyCorrectLights"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false">
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          ${targetsHtml}
        </a-scene>
      `;

      document.body.insertAdjacentHTML('beforeend', sceneHtml);
      activeScene = document.getElementById('mindarScene');

      activeScene.addEventListener('arReady', () => {
        startScreen.style.display = 'none';
        arTopbar.style.display = 'flex';
        reticle.style.display = 'block';
        hud.style.display = 'flex';
      });

      activeScene.addEventListener('arError', (e) => {
        startScreen.style.display = 'flex';
        startBtn.disabled = false;
        startBtn.textContent = '📷 Start Camera Scanner';
        startError.textContent = 'Please allow camera permission in your browser to scan.';
        startError.style.display = 'block';
      });

      // Bind target detection
      experiences.forEach((exp, idx) => {
        const anchor = document.getElementById(`targetAnchor-${idx}`);
        if (!anchor) return;

        anchor.addEventListener('targetFound', () => {
          if (!isRecognizing) return;
          onPhotographRecognized(exp);
        });
      });
    }

    // 3. Photograph Recognized: Transition from Camera to Immersive Playback
    function onPhotographRecognized(memory) {
      isRecognizing = false;

      // Visual feedback on reticle
      reticle.classList.add('active');
      hint.textContent = `✨ Found: ${memory.title}`;

      // Short loading animation (1.2 seconds) with cute dots
      loadingMemoryTitle.textContent = `"${memory.title || 'Memory'}"`;
      loadingOverlay.style.display = 'flex';

      setTimeout(() => {
        loadingOverlay.style.display = 'none';
        reticle.classList.remove('active');
        openImmersiveVideoPlayer(memory);
      }, 1300);
    }

    // 4. Immersive Full-Screen Video Player
    function openImmersiveVideoPlayer(memory) {
      playerTitle.textContent = memory.title || 'Memory';
      immersiveVideo.src = memory.videoUrl;
      immersiveVideo.muted = !soundEnabled;

      videoOverlay.style.display = 'flex';
      updatePlayerControls();

      immersiveVideo.play().catch(err => {
        console.warn('Auto-play muted fallback:', err);
        immersiveVideo.muted = true;
        soundEnabled = false;
        updatePlayerControls();
        immersiveVideo.play().catch(() => {});
      });

      immersiveVideo.onended = () => {
        playPauseBtn.textContent = '▶ Replay';
      };
    }

    function closeImmersiveVideoPlayer() {
      immersiveVideo.pause();
      immersiveVideo.src = '';
      videoOverlay.style.display = 'none';
      hint.textContent = 'Point camera at your photo';

      // Brief delay before re-enabling recognition so it doesn't instantly retrigger
      setTimeout(() => {
        isRecognizing = true;
      }, 700);
    }

    // Controls
    playPauseBtn.addEventListener('click', () => {
      if (immersiveVideo.paused) {
        immersiveVideo.play();
        playPauseBtn.textContent = '⏸ Pause';
      } else {
        immersiveVideo.pause();
        playPauseBtn.textContent = '▶ Play';
      }
    });

    muteToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      immersiveVideo.muted = !soundEnabled;
      updatePlayerControls();
    });

    switchAudioBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      switchAudioBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Muted';
    });

    function updatePlayerControls() {
      muteToggleBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Muted';
      playPauseBtn.textContent = immersiveVideo.paused ? '▶ Play' : '⏸ Pause';
    }

    closePlayerBtn.addEventListener('click', closeImmersiveVideoPlayer);
    scanAgainBtn.addEventListener('click', closeImmersiveVideoPlayer);

    // Run init on page load
    init();
  </script>
</body>
</html>
