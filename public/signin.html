<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — PicsAlive</title>
  <meta name="description" content="Sign in to your private PicsAlive account to view and manage your memories.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-card__logo">
      <a href="/" aria-label="PicsAlive Home">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        Pics<span>Alive</span>
      </a>
    </div>

    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__subtitle">Sign in to access your private interactive memories</p>

    <div id="authAlert" class="auth-message auth-message--error" style="display: none;"></div>

    <!-- Google Sign In Button -->
    <button type="button" class="google-btn" id="googleSignInBtn">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; margin-right: 10px;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="form-divider">or continue with email</div>

    <!-- Email Sign In Form -->
    <form id="signInForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Your password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn--primary" id="submitBtn" style="width: 100%; margin-top: 12px; justify-content: center;">
        Sign In
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 28px; text-align: center; font-size: 14px; color: var(--text-muted);">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    // Redirect if already authenticated
    Auth.redirectIfAuthed();

    const form = document.getElementById('signInForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleSignInBtn');
    const alertBox = document.getElementById('authAlert');

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) return showAlert('Please enter your email address.');
      if (!password) return showAlert('Please enter your password.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await Auth.signIn(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert(Auth.getErrorMessage(err));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    googleBtn.addEventListener('click', async () => {
      clearAlert();
      googleBtn.disabled = true;
      try {
        await Auth.signInWithGoogle();
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert(Auth.getErrorMessage(err));
        googleBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
